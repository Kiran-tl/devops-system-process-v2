name: Deploy to Staging

# pull_request_target: always use this workflow from the PR base (staging/main),
# not an outdated copy on the feature branch.
# workflow_dispatch: manual redeploy without needing a PR label.
on:
  pull_request_target:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch to deploy to staging'
        required: true
        default: 'staging'
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging Environment
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'approved-for-staging'
    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      LXD_CONTAINER: myapp
      BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.pull_request.head.ref }}

    steps:
      - name: Verify container exists
        run: |
          lxc info "$LXD_CONTAINER"

      - name: Deploy application
        run: |
          lxc exec "$LXD_CONTAINER" --env "BRANCH=${BRANCH}" -- bash -s <<'DEPLOY'
          set -euo pipefail

          echo "Deploying branch: $BRANCH"
          cd ~/devops-system-process-v2

          git fetch origin
          git checkout -f "$BRANCH"
          git reset --hard "origin/$BRANCH"

          npm ci
          npm run build

          # Free port 8385 only — never pkill by process name (can SIGTERM this shell → exit 143)
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 8385/tcp 2>/dev/null || true
          else
            for pid in $(ss -lptn 'sport = :8385' 2>/dev/null | grep -oP 'pid=\K[0-9]+' | sort -u); do
              kill "$pid" 2>/dev/null || true
            done
          fi
          sleep 2

          HOST=0.0.0.0 PORT=8385 BROWSER=none \
            nohup npm start > ~/devops-system-process-v2/react.log 2>&1 &

          for i in $(seq 1 15); do
            if ss -lntp | grep -q 8385; then
              echo "App is listening on 8385"
              ss -lntp | grep 8385
              exit 0
            fi
            sleep 2
          done

          echo "App did not listen on 8385 in time. Last log lines:"
          tail -n 50 ~/devops-system-process-v2/react.log || true
          exit 1
          DEPLOY

      - name: Update labels
        if: success() && github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.pull_request.number;

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              name: 'approved-for-staging'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              labels: ['deployed-to-staging']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: '✅ Successfully deployed to Staging.'
            });

      - name: Deployment failed
        if: failure() && github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '❌ Staging deployment failed. Please check the GitHub Actions logs.'
            });
