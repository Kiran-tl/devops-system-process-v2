# =============================================================================
# LABEL → ACTION MAP (Staging)
# =============================================================================
#   approved-for-staging   →  RUN this workflow (deploy feature branch to staging)
#   deployed-to-staging    →  SET automatically after a successful deploy
#   approved-for-production→  does NOT run this workflow (see deploy-prod.yml)
# =============================================================================
name: "Label: approved-for-staging → Deploy Staging"

on:
  # Fires when ANY label is added to a PR. Job `if` keeps only approved-for-staging.
  pull_request_target:
    types:
      - labeled
  # Manual redeploy (Actions → this workflow → Run workflow)
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch to deploy to staging'
        required: true
        default: 'staging'
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: "approved-for-staging → Deploy to Staging"
    # Only run when the label that was just added is approved-for-staging
    # (or when started manually from the Actions tab)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'approved-for-staging'
    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      LXD_CONTAINER: myapp
      BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.pull_request.head.ref }}

    steps:
      - name: "Confirm trigger (approved-for-staging)"
        run: |
          echo "Workflow : Label approved-for-staging → Deploy Staging"
          echo "Trigger  : ${{ github.event_name }}"
          echo "Label    : ${{ github.event.label.name || 'n/a (manual run)' }}"
          echo "Branch   : ${BRANCH}"
          echo "PR       : #${{ github.event.pull_request.number || 'n/a' }}"

      - name: Verify container exists
        run: |
          lxc info "$LXD_CONTAINER"

      - name: Deploy application
        run: |
          lxc exec "$LXD_CONTAINER" --env "BRANCH=${BRANCH}" -- bash -s <<'DEPLOY'
          set -euo pipefail

          echo "Deploying branch: $BRANCH"
          cd ~/devops-system-process-v2

          git fetch origin
          git checkout -f "$BRANCH"
          git reset --hard "origin/$BRANCH"

          npm ci
          npm run build

          # Free port 8385 only — never pkill by process name (can SIGTERM this shell → exit 143)
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 8385/tcp 2>/dev/null || true
          else
            for pid in $(ss -lptn 'sport = :8385' 2>/dev/null | grep -oP 'pid=\K[0-9]+' | sort -u); do
              kill "$pid" 2>/dev/null || true
            done
          fi
          sleep 2

          HOST=0.0.0.0 PORT=8385 BROWSER=none \
            nohup npm start > ~/devops-system-process-v2/react.log 2>&1 &

          for i in $(seq 1 15); do
            if ss -lntp | grep -q 8385; then
              echo "App is listening on 8385"
              ss -lntp | grep 8385
              exit 0
            fi
            sleep 2
          done

          echo "App did not listen on 8385 in time. Last log lines:"
          tail -n 50 ~/devops-system-process-v2/react.log || true
          exit 1
          DEPLOY

      - name: "Swap labels: approved-for-staging → deployed-to-staging"
        if: success() && github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.pull_request.number;

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              name: 'approved-for-staging'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              labels: ['deployed-to-staging']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: [
                '## ✅ Staging deploy succeeded',
                '',
                '| Item | Value |',
                '|------|-------|',
                '| Trigger label | `approved-for-staging` |',
                '| Result label | `deployed-to-staging` |',
                '| Branch deployed | `${{ env.BRANCH }}` |',
                '| URL | http://172.16.16.121:8385/ |',
                '',
                'Next: after QA, add label **`approved-for-production`** to deploy production.'
              ].join('\n')
            });

      - name: Deployment failed
        if: failure() && github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## ❌ Staging deploy failed',
                '',
                'Triggered by label `approved-for-staging`.',
                'Check the Actions run: **Label: approved-for-staging → Deploy Staging**.',
                'Fix the issue, then re-add `approved-for-staging` to retry.'
              ].join('\n')
            });
