name: Deploy to Staging

on:
  pull_request:
    types:
      - labeled

jobs:
  deploy-staging:
    if: ${{ github.event.label.name == 'status: approved-for-staging' }}

    runs-on:
      - self-hosted
      - Linux
      - X64

    environment:
      name: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: staging

      - name: Deploy to LXD Container
        run: |
          lxc exec myapp -- bash -c "
            cd ~/devops-system-process-v2 &&
            git fetch origin &&
            git checkout ${{ github.event.pull_request.head.ref }} &&
            git pull origin ${{ github.event.pull_request.head.ref }} &&
            npm ci &&
            npm run build
          "

      - name: Update Labels
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.pull_request.number;

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              name: "status: approved-for-staging"
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              labels: ["status: deployed-to-staging"]
            });