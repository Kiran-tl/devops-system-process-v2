name: Deploy to Staging

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Staging Environment
    if: github.event.label.name == 'approved-for-staging'
    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      LXD_CONTAINER: myapp
      BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify container exists
        run: |
          lxc info "$LXD_CONTAINER"

      - name: Deploy application
        run: |
          lxc exec "$LXD_CONTAINER" -- bash -c "
            set -e

            cd ~/devops-system-process-v2

            git fetch origin
            git checkout $BRANCH
            git pull origin $BRANCH

            npm ci
            npm run build

            # Restart React app on port 8385 only
            pkill -f 'react-scripts' || true
            sleep 1
            HOST=0.0.0.0 PORT=8385 BROWSER=none nohup npm start > ~/devops-system-process-v2/react.log 2>&1 &
            sleep 5
            ss -lntp | grep 8385
          "

      - name: Update labels
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.pull_request.number;

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              name: 'approved-for-staging'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              labels: ['deployed-to-staging']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: '✅ Successfully deployed to Staging.'
            });

      - name: Deployment failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '❌ Staging deployment failed. Please check the GitHub Actions logs.'
            });
