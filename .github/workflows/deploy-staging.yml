name: Deploy to Staging

on:
  pull_request:
    types: [labeled]

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    if: "github.event.label.name == 'approved-for-staging'"
    runs-on: self-hosted
    environment:
      name: staging
      url: http://workflow-playground.172.16.16.121.nip.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # ── Adapt the build steps to your stack ─────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for staging
        run: npm run build
        env:
          NODE_ENV: staging
      # ────────────────────────────────────────────────────────────────────────

      - name: Deploy to Staging Server via SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no deploy@10.94.186.44 << 'ENDSSH'
            cd /var/www/webapp
            git fetch origin
            git checkout ${{ github.head_ref }}
            git pull origin ${{ github.head_ref }}
            npm ci
            REACT_APP_ENV=staging npm run build
          ENDSSH
          rm -f /tmp/deploy_key

      - name: Update PR label — mark as deployed to staging
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.removeLabel({
              owner, repo, issue_number,
              name: 'approved-for-staging'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner, repo, issue_number,
              labels: ['deployed-to-staging']
            });


      - name: Handle deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🔴 Staging Deployment Failed\n\nThe automated deployment to staging failed. DevOps team has been notified.\n\n[View run details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
