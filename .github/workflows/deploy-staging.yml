name: Deploy to Staging

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: "github.event.label.name == 'status: approved-for-staging'"

    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      LXD_CONTAINER: myapp
      BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify container exists
        run: |
          lxc info "$LXD_CONTAINER"

      - name: Deploy application
        run: |
          lxc exec "$LXD_CONTAINER" -- bash -c "
            set -e

            cd ~/devops-system-process-v2

            git fetch origin
            git checkout $BRANCH
            git pull origin $BRANCH

            npm ci
            npm run build

            if systemctl list-unit-files | grep -q myapp.service; then
              systemctl restart myapp
            elif command -v nginx >/dev/null 2>&1; then
              systemctl reload nginx
            else
              echo 'No restart command configured'
            fi
          "

      - name: Update labels
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue=context.payload.pull_request.number;

            await github.rest.issues.removeLabel({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:issue,
              name:"status: approved-for-staging"
            }).catch(()=>{});

            await github.rest.issues.addLabels({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:issue,
              labels:["status: deployed-to-staging"]
            });

            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:issue,
              body:"✅ Successfully deployed to Staging."
            });

      - name: Deployment failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:context.payload.pull_request.number,
              body:"❌ Staging deployment failed. Please check the GitHub Actions logs."
            });