name: Notify Rejection

on:
  pull_request:
    types:
      - labeled

permissions:
  issues: write
  pull-requests: write

jobs:
  notify:
    if: github.event.label.name == 'status: rejected'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## ❌ Feature Rejected

Please fix the requested changes and push them to the same branch.

After that, change the label back to:

status: ready-for-review`
            })