name: Notify Rejection

on:
  pull_request:
    types:
      - labeled

permissions:
  issues: write
  pull-requests: write

jobs:
  notify:
    if: "github.event.label.name == 'status: rejected'"
    #
    runs-on: ubuntu-latest

    steps:
      - name: Add rejection comment
        uses: actions/github-script@v7
        with:
          script: |
            const message = `
            ## ❌ Feature Rejected

            Please fix the requested changes and push them to the same branch.

            Check failure on line 28 in:
            .github/workflows/notify-rejection.yml

            **GitHub Actions**
            / .github/workflows/notify-rejection.yml

            **Error:**
            Invalid workflow file

            You have an error in your YAML syntax on line 28.

            After fixing the issue, change the label back to:

            status: ready-for-review
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message
            });