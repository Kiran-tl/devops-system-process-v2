name: Notify on Rejection

on:
  pull_request:
    types:
      - labeled

permissions:
  issues: write
  pull-requests: write

jobs:
  notify:
    name: Notify developer of rejection
    if: github.event.label.name == 'rejected'
    runs-on: ubuntu-latest

    steps:
      - name: Add rejection comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## ❌ Feature Rejected',
                '',
                `Hi @${context.payload.pull_request.user.login},`,
                '',
                'Your feature has been rejected. Please:',
                '',
                '1. Read the reviewer/QA comments above carefully',
                '2. Fix the issues on **this same branch** (no new branch needed)',
                '3. Push your fixes: `git push origin ${{ github.head_ref }}`',
                '4. Update this PR\'s label back to `ready-for-review`',
                '',
                'The reviewer will then re-review your changes.',
                '',
                '_Automated notification from DevOps pipeline_'
              ].join('\n')
            });
