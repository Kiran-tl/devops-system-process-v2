# =============================================================================
# PRODUCTION DEPLOY
# =============================================================================
# Flow:
#   1. Open PR: staging → production
#   2. Add label: approved-for-production  (marks PR ready in dashboard)
#   3. Click "Manual Deploy to Production" in the Docker dashboard UI
#   4. This workflow runs immediately, merges the PR, deploys, and shows
#      "Deployed to Production" on http://172.16.16.121:8385/
# =============================================================================
name: "Manual: Deploy Production"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Production PR number (must target production and have approved-for-production label)'
        required: true
        type: string
      version:
        description: 'Release version shown in UI and used for the git tag (example 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate production PR"
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      version: ${{ steps.resolve.outputs.version }}
      should_merge: ${{ steps.resolve.outputs.should_merge }}

    steps:
      - name: "Confirm manual production trigger"
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ inputs.pr_number }}', 10);
            let version = '${{ inputs.version }}'.trim();
            version = version.replace(/^v/i, '');

            if (!prNumber || Number.isNaN(prNumber)) {
              core.setFailed('❌ pr_number is required');
              return;
            }
            if (!version) {
              core.setFailed('❌ version is required');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const labels = pr.data.labels.map(l => l.name);
            console.log('PR Labels:', labels);
            console.log('PR base branch:', pr.data.base.ref);
            console.log('PR head branch:', pr.data.head.ref);
            console.log('Version:', version);

            if (pr.data.base.ref !== 'production') {
              core.setFailed(
                `❌ Deploy aborted. PR #${prNumber} must target the production branch.`
              );
              return;
            }

            const isOpen = pr.data.state === 'open';
            const approved = labels.includes('approved-for-production');
            const alreadyDeployed = labels.includes('deployed-to-production');

            // Open PRs need approved-for-production. Merged PRs can be redeployed.
            if (isOpen && !approved) {
              core.setFailed(
                `❌ Deploy aborted. PR #${prNumber} does not have the ` +
                `"approved-for-production" label.`
              );
              return;
            }

            if (!isOpen && pr.data.merged !== true && !alreadyDeployed) {
              core.setFailed(`❌ Deploy aborted. PR #${prNumber} is closed and was not merged.`);
              return;
            }

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('version', version);
            core.setOutput('should_merge', isOpen ? 'true' : 'false');
            core.info(`✅ Manual production deploy allowed for PR #${prNumber} (v${version})`);

  deploy:
    name: "Deploy to Production"
    needs: validate
    runs-on:
      - self-hosted
      - Linux
      - X64
    environment:
      name: production
      url: http://172.16.16.121:8385/

    env:
      LXD_CONTAINER: myapp

    steps:
      - name: "Confirm production deploy"
        run: |
          echo "Workflow : Manual Deploy Production"
          echo "Trigger  : Dashboard / Actions workflow_dispatch"
          echo "PR       : #${{ needs.validate.outputs.pr_number }}"
          echo "Version  : ${{ needs.validate.outputs.version }}"
          echo "Branch   : production"

      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Merge approved PR into production
        if: needs.validate.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ needs.validate.outputs.pr_number }}"

          git config user.name github-actions
          git config user.email github-actions@github.com

          # Merge via GitHub API (self-hosted runner may not have the gh CLI)
          HTTP_CODE=$(curl -sS -o /tmp/pr-merge.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}/merge" \
            -d '{"merge_method":"merge"}')

          echo "PR merge HTTP status: ${HTTP_CODE}"
          cat /tmp/pr-merge.json || true

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            # 405 = already merged; continue if so
            if [ "$HTTP_CODE" = "405" ] && grep -qi 'already merged\|Pull Request is not mergeable' /tmp/pr-merge.json; then
              echo "PR appears already merged — continuing"
            else
              echo "Failed to merge PR #${PR_NUMBER}"
              exit 1
            fi
          fi

          git fetch origin production
          git checkout -B production origin/production
          git reset --hard origin/production
          echo "Production HEAD: $(git rev-parse --short HEAD)"

      - name: Sync production checkout
        if: needs.validate.outputs.should_merge != 'true'
        run: |
          set -euo pipefail
          git fetch origin production
          git checkout -B production origin/production
          git reset --hard origin/production
          echo "Production HEAD: $(git rev-parse --short HEAD)"

      - name: Create Release Tag
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="v${VERSION}"

          git config user.name github-actions
          git config user.email github-actions@github.com

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping create"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

      - name: Verify LXD container
        run: |
          lxc info "$LXD_CONTAINER"

      - name: Deploy application
        run: |
          lxc exec "$LXD_CONTAINER" -- bash -s <<DEPLOY
          set -euo pipefail

          cd ~/devops-system-process-v2

          git fetch origin
          git checkout -f production
          git reset --hard origin/production

          cat > .env <<EOF
          REACT_APP_DEPLOYMENT_STAGE=production
          REACT_APP_DEPLOYMENT_LABEL=Deployed to Production
          REACT_APP_BUILD_VERSION=${{ needs.validate.outputs.version }}
          EOF

          # Stop the previous app before reinstalling dependencies from the same worktree.
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 8385/tcp 2>/dev/null || true
          else
            for pid in \$(ss -lptn 'sport = :8385' 2>/dev/null | grep -oP 'pid=\K[0-9]+' | sort -u); do
              kill "\$pid" 2>/dev/null || true
            done
          fi
          pkill -f "react-scripts start" 2>/dev/null || true
          rm -rf node_modules/.cache
          sleep 2

          npm ci
          npm run build

          HOST=0.0.0.0 PORT=8385 BROWSER=none \\
            nohup npm start > ~/devops-system-process-v2/react.log 2>&1 &

          for i in \$(seq 1 20); do
            if ss -lntp | grep -q 8385; then
              echo "App is listening on 8385"
              ss -lntp | grep 8385
              exit 0
            fi
            sleep 2
          done

          echo "App did not listen on 8385 in time. Last log lines:"
          tail -n 50 ~/devops-system-process-v2/react.log || true
          exit 1
          DEPLOY

      - name: "Swap labels: approved-for-production → deployed-to-production"
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = Number('${{ needs.validate.outputs.pr_number }}');

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              name: 'approved-for-production'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              labels: ['deployed-to-production']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: [
                '## 🚀 Production deploy succeeded',
                '',
                '| Item | Value |',
                '|------|-------|',
                '| Trigger | Manual Deploy from dashboard / Actions |',
                '| Result label | `deployed-to-production` |',
                '| Branch deployed | `production` |',
                '| Build version | `${{ needs.validate.outputs.version }}` |',
                '| App output | **Deployed to Production** |',
                '| URL | http://172.16.16.121:8385/ |'
              ].join('\n')
            });

      - name: Deployment failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = Number('${{ needs.validate.outputs.pr_number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: [
                '## ❌ Production deploy failed',
                '',
                'Manual production deploy failed.',
                'PR must target `production` and have label `approved-for-production`.',
                'Check the Actions run: **Manual: Deploy Production** and retry from the dashboard.'
              ].join('\n')
            });
