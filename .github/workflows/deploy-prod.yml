name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy to production'
        required: true
        type: string
      version:
        description: 'Release version (example 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Validate PR approval
    runs-on: ubuntu-latest
    outputs:
      pr_title: ${{ steps.get_pr.outputs.title }}

    steps:
      - name: Validate label and extract PR info
        id: get_pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt('${{ inputs.pr_number }}')
            });

            const labels = pr.data.labels.map(l => l.name);
            console.log('PR Labels:', labels);

            if (!labels.includes('approved-for-production')) {
              core.setFailed(
                `❌ Deploy aborted. PR #${{ inputs.pr_number }} does not have the ` +
                `"approved-for-production" label. QA must approve before deploying.`
              );
              return;
            }

            core.setOutput('title', pr.data.title);

  deploy:
    name: Deploy to Production Environment
    needs: validate
    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      LXD_CONTAINER: myapp

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Create Release Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Verify LXD container
        run: |
          lxc info "$LXD_CONTAINER"

      - name: Deploy application
        run: |
          lxc exec "$LXD_CONTAINER" -- bash -s <<'DEPLOY'
          set -euo pipefail

          cd ~/devops-system-process-v2

          git fetch origin
          git checkout -f production
          git reset --hard origin/production

          npm ci
          npm run build

          # Free port 8385 only — never pkill by process name (can SIGTERM this shell → exit 143)
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 8385/tcp 2>/dev/null || true
          else
            for pid in $(ss -lptn 'sport = :8385' 2>/dev/null | grep -oP 'pid=\K[0-9]+' | sort -u); do
              kill "$pid" 2>/dev/null || true
            done
          fi
          sleep 2

          HOST=0.0.0.0 PORT=8385 BROWSER=none \
            nohup npm start > ~/devops-system-process-v2/react.log 2>&1 &

          for i in $(seq 1 15); do
            if ss -lntp | grep -q 8385; then
              echo "App is listening on 8385"
              ss -lntp | grep 8385
              exit 0
            fi
            sleep 2
          done

          echo "App did not listen on 8385 in time. Last log lines:"
          tail -n 50 ~/devops-system-process-v2/react.log || true
          exit 1
          DEPLOY

      - name: Update PR labels
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = Number('${{ inputs.pr_number }}');

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              name: 'approved-for-production'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              labels: ['deployed-to-production']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: '🚀 Production deployment completed successfully.'
            });
