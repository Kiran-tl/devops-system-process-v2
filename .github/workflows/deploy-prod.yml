name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR Number
        required: true

      release_version:
        description: Release Version
        required: true

jobs:

  validate:

    runs-on: ubuntu-latest

    outputs:
      title: ${{ steps.pr.outputs.title }}

    steps:

      - id: pr

        uses: actions/github-script@v7

        with:

          script: |

            const pr = await github.rest.pulls.get({

              owner: context.repo.owner,

              repo: context.repo.repo,

              pull_number: Number('${{ github.event.inputs.pr_number }}')

            })

            const labels = pr.data.labels.map(l => l.name)

            if(!labels.includes("status: approved-for-production")){

              core.setFailed("Production approval missing")

              return

            }

            core.setOutput("title",pr.data.title)

  deploy:

    needs: validate

    runs-on: self-hosted

    environment: production

    steps:

      - uses: actions/checkout@v4

        with:

          ref: production

      - uses: actions/setup-node@v4

        with:

          node-version: 24

          cache: npm

      - run: npm ci

      - run: npm run build

        env:

          NODE_ENV: production

      - name: Deploy into LXD

        run: |

          lxc exec myapp -- bash -c "

            cd ~/devops-system-process-v2 &&

            git fetch origin &&

            git checkout production &&

            git pull origin production &&

            npm ci &&

            npm run build

          "