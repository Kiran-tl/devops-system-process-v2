# =============================================================================
# LABEL → ACTION MAP (Production)
# =============================================================================
#   approved-for-production → ALLOW manual production deploy
#   deployed-to-production  → SET automatically after a successful deploy
#   approved-for-staging    → does NOT run this workflow (see deploy-staging.yml)
# =============================================================================
name: "Manual: Deploy Production"

on:
  # Manual production deploy after PR to production has approved-for-production label.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Production PR number (must target production and have approved-for-production label)'
        required: true
        type: string
      version:
        description: 'Release version shown in UI and used for the git tag (example 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: "Validate production label and PR target"
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: "Confirm trigger (approved-for-production)"
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            const prNumber = parseInt('${{ inputs.pr_number }}', 10);
            const version = '${{ inputs.version }}';

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const labels = pr.data.labels.map(l => l.name);
            console.log('PR Labels:', labels);
            console.log('Trigger:', eventName);
            console.log('Expected label: approved-for-production');
            console.log('PR base branch:', pr.data.base.ref);

            if (pr.data.base.ref !== 'production') {
              core.setFailed(
                `❌ Deploy aborted. PR #${prNumber} must target the production branch.`
              );
              return;
            }

            if (!labels.includes('approved-for-production')) {
              core.setFailed(
                `❌ Deploy aborted. PR #${prNumber} does not have the ` +
                `"approved-for-production" label. Add that label before using Run workflow.`
              );
              return;
            }

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('version', version);
            core.info(`✅ approved-for-production OK — manual production deploy allowed (tag: ${version})`);

  deploy:
    name: "approved-for-production → Deploy to Production"
    needs: validate
    runs-on:
      - self-hosted
      - Linux
      - X64
    environment:
      name: production
      url: http://172.16.16.121:8385/

    env:
      LXD_CONTAINER: myapp

    steps:
      - name: "Confirm production deploy"
        run: |
          echo "Workflow : Manual Deploy Production"
          echo "Approval : PR must already have approved-for-production label"
          echo "PR       : #${{ needs.validate.outputs.pr_number }}"
          echo "Version  : ${{ needs.validate.outputs.version }}"
          echo "Branch   : production"

      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Create Release Tag
        if: needs.validate.outputs.version != ''
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          git config user.name github-actions
          git config user.email github-actions@github.com

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — skipping create"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Verify LXD container
        run: |
          lxc info "$LXD_CONTAINER"

      - name: Deploy application
        run: |
          lxc exec "$LXD_CONTAINER" -- bash -s <<'DEPLOY'
          set -euo pipefail

          cd ~/devops-system-process-v2

          git fetch origin
          git checkout -f production
          git reset --hard origin/production

          cat > .env <<EOF
          REACT_APP_DEPLOYMENT_STAGE=production
          REACT_APP_DEPLOYMENT_LABEL=Deployed to Production
          REACT_APP_BUILD_VERSION=${{ needs.validate.outputs.version }}
          EOF

          # Stop the previous app before reinstalling dependencies from the same worktree.
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 8385/tcp 2>/dev/null || true
          else
            for pid in $(ss -lptn 'sport = :8385' 2>/dev/null | grep -oP 'pid=\K[0-9]+' | sort -u); do
              kill "$pid" 2>/dev/null || true
            done
          fi
          pkill -f "react-scripts start" 2>/dev/null || true
          rm -rf node_modules/.cache
          sleep 2

          npm ci
          npm run build

          HOST=0.0.0.0 PORT=8385 BROWSER=none \
            nohup npm start > ~/devops-system-process-v2/react.log 2>&1 &

          for i in $(seq 1 15); do
            if ss -lntp | grep -q 8385; then
              echo "App is listening on 8385"
              ss -lntp | grep 8385
              exit 0
            fi
            sleep 2
          done

          echo "App did not listen on 8385 in time. Last log lines:"
          tail -n 50 ~/devops-system-process-v2/react.log || true
          exit 1
          DEPLOY

      - name: "Swap labels: approved-for-production → deployed-to-production"
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = Number('${{ needs.validate.outputs.pr_number }}');

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              name: 'approved-for-production'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              labels: ['deployed-to-production']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: [
                '## 🚀 Production deploy succeeded',
                '',
                '| Item | Value |',
                '|------|-------|',
                '| Trigger type | `Run workflow` (manual) |',
                '| Required label | `approved-for-production` |',
                '| Result label | `deployed-to-production` |',
                '| Branch deployed | `production` |',
                '| Version tag | `v${{ needs.validate.outputs.version }}` |',
                '| URL | http://172.16.16.121:8385/ |'
              ].join('\n')
            });

      - name: Deployment failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = Number('${{ needs.validate.outputs.pr_number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: [
                '## ❌ Production deploy failed',
                '',
                'Manual production deploy failed.',
                'PR must target `production` and have label `approved-for-production`.',
                'Check the Actions run: **Manual: Deploy Production** and rerun it after fixing the issue.'
              ].join('\n')
            });
