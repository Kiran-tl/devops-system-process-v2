name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy to production'
        required: true
        type: string
      version:
        description: 'Release version (example 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Validate PR approval
    runs-on: ubuntu-latest
    outputs:
      pr_title: ${{ steps.get_pr.outputs.title }}

    steps:
      - name: Validate label and extract PR info
        id: get_pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt('${{ inputs.pr_number }}')
            });

            const labels = pr.data.labels.map(l => l.name);
            console.log('PR Labels:', labels);

            if (!labels.includes('approved-for-production')) {
              core.setFailed(
                `❌ Deploy aborted. PR #${{ inputs.pr_number }} does not have the ` +
                `"approved-for-production" label. QA must approve before deploying.`
              );
              return;
            }

            core.setOutput('title', pr.data.title);

  deploy:
    name: Deploy to Production Environment
    needs: validate
    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      LXD_CONTAINER: myapp

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Create Release Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Verify LXD container
        run: |
          lxc info "$LXD_CONTAINER"

      - name: Deploy application
        run: |
          lxc exec "$LXD_CONTAINER" -- bash -c "
            set -e

            cd ~/devops-system-process-v2

            git fetch origin
            git checkout production
            git pull origin production

            npm ci
            npm run build

            if systemctl list-unit-files | grep -q myapp.service; then
              systemctl restart myapp
            elif command -v nginx >/dev/null 2>&1; then
              systemctl reload nginx
            else
              echo 'No restart command configured'
            fi
          "

      - name: Update PR labels
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = Number('${{ inputs.pr_number }}');

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              name: 'approved-for-production'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              labels: ['deployed-to-production']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: '🚀 Production deployment completed successfully.'
            });
