# =============================================================================
# LABEL → ACTION MAP (Production)
# =============================================================================
#   approved-for-production → RUN this workflow (deploy production branch)
#   deployed-to-production  → SET automatically after a successful deploy
#   approved-for-staging    → does NOT run this workflow (see deploy-staging.yml)
# =============================================================================
name: "Label: approved-for-production → Deploy Production"

on:
  # Fires when ANY label is added to a PR. Job `if` keeps only approved-for-production.
  pull_request_target:
    types:
      - labeled
  # Manual redeploy (Actions → this workflow → Run workflow)
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to update labels on after deploy'
        required: true
        type: string
      version:
        description: 'Release version tag (example 1.0.0). Leave empty to skip tagging.'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: "Check label approved-for-production"
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'approved-for-production'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: "Confirm trigger (approved-for-production)"
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            let prNumber;
            let version = '';

            if (eventName === 'workflow_dispatch') {
              prNumber = parseInt('${{ inputs.pr_number }}', 10);
              version = '${{ inputs.version }}';
            } else {
              prNumber = context.payload.pull_request.number;
              // Auto version from date + run number when triggered by label
              const d = new Date();
              const stamp = d.toISOString().slice(0, 10).replace(/-/g, '');
              version = `1.0.${stamp}-${context.runNumber}`;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const labels = pr.data.labels.map(l => l.name);
            console.log('PR Labels:', labels);
            console.log('Trigger:', eventName);
            console.log('Expected label: approved-for-production');

            // Label event already filtered by job if; still verify for manual runs
            if (eventName === 'workflow_dispatch' && !labels.includes('approved-for-production')) {
              core.setFailed(
                `❌ Deploy aborted. PR #${prNumber} does not have the ` +
                `"approved-for-production" label. Add that label (or use it to auto-trigger).`
              );
              return;
            }

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('version', version);
            core.info(`✅ approved-for-production OK — will deploy production (tag: ${version || 'none'})`);

  deploy:
    name: "approved-for-production → Deploy to Production"
    needs: validate
    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      LXD_CONTAINER: myapp

    steps:
      - name: "Confirm production deploy"
        run: |
          echo "Workflow : Label approved-for-production → Deploy Production"
          echo "PR       : #${{ needs.validate.outputs.pr_number }}"
          echo "Version  : ${{ needs.validate.outputs.version }}"
          echo "Branch   : production"

      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Create Release Tag
        if: needs.validate.outputs.version != ''
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          git config user.name github-actions
          git config user.email github-actions@github.com

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — skipping create"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Verify LXD container
        run: |
          lxc info "$LXD_CONTAINER"

      - name: Deploy application
        run: |
          lxc exec "$LXD_CONTAINER" -- bash -s <<'DEPLOY'
          set -euo pipefail

          cd ~/devops-system-process-v2

          git fetch origin
          git checkout -f production
          git reset --hard origin/production

          npm ci
          npm run build

          # Free port 8385 only — never pkill by process name (can SIGTERM this shell → exit 143)
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 8385/tcp 2>/dev/null || true
          else
            for pid in $(ss -lptn 'sport = :8385' 2>/dev/null | grep -oP 'pid=\K[0-9]+' | sort -u); do
              kill "$pid" 2>/dev/null || true
            done
          fi
          sleep 2

          HOST=0.0.0.0 PORT=8385 BROWSER=none \
            nohup npm start > ~/devops-system-process-v2/react.log 2>&1 &

          for i in $(seq 1 15); do
            if ss -lntp | grep -q 8385; then
              echo "App is listening on 8385"
              ss -lntp | grep 8385
              exit 0
            fi
            sleep 2
          done

          echo "App did not listen on 8385 in time. Last log lines:"
          tail -n 50 ~/devops-system-process-v2/react.log || true
          exit 1
          DEPLOY

      - name: "Swap labels: approved-for-production → deployed-to-production"
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = Number('${{ needs.validate.outputs.pr_number }}');

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              name: 'approved-for-production'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              labels: ['deployed-to-production']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: [
                '## 🚀 Production deploy succeeded',
                '',
                '| Item | Value |',
                '|------|-------|',
                '| Trigger label | `approved-for-production` |',
                '| Result label | `deployed-to-production` |',
                '| Branch deployed | `production` |',
                '| Version tag | `v${{ needs.validate.outputs.version }}` |',
                '| URL | http://172.16.16.121:8385/ |'
              ].join('\n')
            });

      - name: Deployment failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = Number('${{ needs.validate.outputs.pr_number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: [
                '## ❌ Production deploy failed',
                '',
                'Triggered by label `approved-for-production`.',
                'Check the Actions run: **Label: approved-for-production → Deploy Production**.',
                'Fix the issue, then re-add `approved-for-production` to retry.'
              ].join('\n')
            });
