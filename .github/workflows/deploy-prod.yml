name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged PR Number"
        required: true
      version:
        description: "Release Version (example 1.0.0)"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  deploy:

    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      LXD_CONTAINER: myapp
      BRANCH: production

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Create Release Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git tag v${{ github.event.inputs.version }}
          git push origin v${{ github.event.inputs.version }}

      - name: Verify LXD container
        run: |
          lxc info "$LXD_CONTAINER"

      - name: Deploy application
        run: |
          lxc exec "$LXD_CONTAINER" -- bash -c "
            set -e

            cd ~/devops-system-process-v2

            git fetch origin
            git checkout production
            git pull origin production

            npm ci
            npm run build

            if systemctl list-unit-files | grep -q myapp.service; then
              systemctl restart myapp
            elif command -v nginx >/dev/null 2>&1; then
              systemctl reload nginx
            else
              echo 'No restart command configured'
            fi
          "

      - name: Update PR labels
        uses: actions/github-script@v7
        with:
          script: |

            const issue=Number("${{ github.event.inputs.pr_number }}");

            await github.rest.issues.removeLabel({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:issue,
              name:"status: approved-for-production"
            }).catch(()=>{});

            await github.rest.issues.addLabels({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:issue,
              labels:["status: deployed-to-production"]
            });

            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:issue,
              body:"🚀 Production deployment completed successfully."
            });